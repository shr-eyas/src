grav_comp:
  type: multi_arm_controllers/GravCompController
  arm_id: $(arg arm_id)
  joint_names:
    - $(arg arm_id)_joint1
    - $(arg arm_id)_joint2
    - $(arg arm_id)_joint3
    - $(arg arm_id)_joint4
    - $(arg arm_id)_joint5
    - $(arg arm_id)_joint6
    - $(arg arm_id)_joint7


mirror_impedance:
  type: multi_arm_controllers/MirrorImpedanceController
  arm_id: $(arg arm_id)
  joint_names:
      - $(arg arm_id)_joint1
      - $(arg arm_id)_joint2
      - $(arg arm_id)_joint3
      - $(arg arm_id)_joint4
      - $(arg arm_id)_joint5
      - $(arg arm_id)_joint6
      - $(arg arm_id)_joint7
  k_gains:
      - 600.0
      - 600.0
      - 600.0
      - 600.0
      - 250.0
      - 150.0
      - 50.0
  d_gains:
      - 50.0
      - 50.0
      - 50.0
      - 20.0
      - 20.0
      - 20.0
      - 10.0
  coriolis_factor: 1.0
  source_topic: /fr3_left/joint_states
  source_arm_id: fr3_left       
  stale_timeout: 0.05